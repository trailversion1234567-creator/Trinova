<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dual Sync Chat | Trinova</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        /* Global Styles & Spack Editor Height Fixes */
        html, body { 
            margin: 0; padding: 0; 
            font-family: 'Poppins', sans-serif;
            background: #0b0f1a; color: #ffffff; 
            height: 100%; /* YAHAN 100vh ko 100% kiya hai */
            overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
        }

        *, *::before, *::after { box-sizing: border-box; }

        /* App Container */
        .app-container {
            width: 100%; max-width: 600px; 
            height: 100%; /* YAHAN BHI 100vh ko 100% kiya hai */
            background: rgba(255, 255, 255, 0.02);
            display: flex; flex-direction: column;
            position: relative;
        }

        /* 📱 Header */
        .header {
            padding: 15px 20px;
            background: rgba(11, 15, 26, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 15px;
            z-index: 10;
            flex-shrink: 0; /* Header apni jagah se na hile */
        }
        
        .back-btn {
            width: 35px; height: 35px;
            background: rgba(255, 255, 255, 0.05); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }
        .back-btn svg { width: 18px; height: 18px; fill: #38bdf8; }
        
        .header-info { display: flex; flex-direction: column; overflow: hidden; }
        .header-info h2 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; margin: 0; color: #38bdf8; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .header-info p { font-size: 0.75rem; opacity: 0.6; margin: 0; }

        /* 💬 Chat Area */
        .chat-box {
            flex-grow: 1; overflow-y: auto;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }
        
        /* Custom Scrollbar */
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }

        /* Message Bubbles */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-sender { font-size: 0.7rem; opacity: 0.6; margin-bottom: 4px; padding: 0 10px; }
        
        .msg {
            padding: 12px 16px; font-size: 0.95rem; line-height: 1.5;
            word-wrap: break-word; position: relative;
        }

        /* User Message (Right Side) */
        .user-wrapper { align-self: flex-end; align-items: flex-end; }
        .user-wrapper .msg {
            background: #38bdf8; color: #000;
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        /* AI Message (Left Side) */
        .ai-wrapper { align-self: flex-start; align-items: flex-start; }
        .ai-wrapper .msg {
            background: rgba(255, 255, 255, 0.08); color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px 18px 18px 4px;
        }

        /* Typing Indicator */
        .typing-indicator {
            font-size: 0.8rem; opacity: 0.6; padding: 5px 20px;
            font-style: italic; display: none; color: #38bdf8;
            flex-shrink: 0;
        }

        /* ⌨️ Input Area */
        .input-area {
            padding: 15px 20px;
            background: rgba(11, 15, 26, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0; /* YAHAN FIX KIYA HAI: Taki ye area dabe nahi */
            padding-bottom: 25px; /* Mobile navigation bar ke liye extra space */
        }
        
        .input-area input {
            flex-grow: 1; padding: 14px 20px;
            border-radius: 25px; border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5); color: #fff; outline: none;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem;
            min-width: 0; /* Flexbox issue fix */
        }
        .input-area input:focus { border-color: #38bdf8; }
        
        .send-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: #38bdf8; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: 0.3s;
            flex-shrink: 0; /* Button chhota nahi hoga */
        }
        .send-btn:hover { background: #7dd3fc; transform: scale(1.05); }
        .send-btn svg { width: 20px; height: 20px; fill: #000; margin-left: 3px; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <a href="option1.html" class="back-btn">
                <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/></svg>
            </a>
            <div class="header-info">
                <h2 id="display-ai-name">Connecting...</h2>
                <p id="display-model-name">Initializing Core</p>
            </div>
        </div>

        <div class="chat-box" id="chat-box"></div>
        
        <div class="typing-indicator" id="typing-indicator">AI is typing...</div>

        <div class="input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleEnter(event)">
            <button class="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const userName = localStorage.getItem('trinova_m1_user');
        const aiName = localStorage.getItem('trinova_m1_ai');
        const aiModel = localStorage.getItem('trinova_m1_model');

        if (!userName || !aiName) {
            window.location.href = 'option1.html';
        }

        window.onload = () => {
            document.getElementById('display-ai-name').innerText = aiName;
            document.getElementById('display-model-name').innerText = `Model: ${aiModel.toUpperCase()}`;
            
            setTimeout(() => {
                appendMessage(aiName, `Haan bhai ${userName}, main ${aiName} aa gaya! Bol kya chal raha hai?`, 'ai');
            }, 600);
        };

        async function sendMessage() {
            const inputField = document.getElementById('chat-input');
            const message = inputField.value.trim();
            if (!message) return;

            appendMessage(userName, message, 'user');
            inputField.value = '';

            const typingIndicator = document.getElementById('typing-indicator');
            typingIndicator.innerText = `${aiName} is typing...`;
            typingIndicator.style.display = 'block';
            scrollToBottom();

            try {
                const response = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        mode: 'option1',
                        model: aiModel,
                        ai_name: aiName,
                        message: message
                    })
                });
                
                const data = await response.json();
                
                typingIndicator.style.display = 'none';
                if(data.reply) {
                    appendMessage(aiName, data.reply, 'ai');
                } else {
                    appendMessage('System', 'Error: No reply received.', 'ai');
                }

            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('System', 'Server connection failed. Is api.php running?', 'ai');
                console.error("Fetch error:", error);
            }
        }

        function appendMessage(senderName, text, type) {
            const chatBox = document.getElementById('chat-box');
            
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = `msg-wrapper ${type === 'user' ? 'user-wrapper' : 'ai-wrapper'}`;
            
            const senderSpan = document.createElement('span');
            senderSpan.className = 'msg-sender';
            senderSpan.innerText = senderName;
            
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.innerText = text;
            
            wrapperDiv.appendChild(senderSpan);
            wrapperDiv.appendChild(msgDiv);
            chatBox.appendChild(wrapperDiv);
            
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
