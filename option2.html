<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Binary Clash | Trinova</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        /* Global Styles & Fixes */
        html, body { 
            margin: 0; padding: 0; 
            font-family: 'Poppins', sans-serif;
            background: #0b0f1a; color: #ffffff; 
            min-height: 100vh; display: flex; 
            align-items: center; justify-content: center;
            overflow-x: hidden; width: 100%;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        /* Glassmorphism Container */
        .app-container {
            width: 90%; max-width: 500px; 
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px; padding: 30px 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            position: relative;
            margin: 20px 0; 
        }

        /* Modern Back Button (Icon) */
        .back-btn {
            position: absolute; left: 20px; top: 20px;
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            text-decoration: none; transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .back-btn:hover { background: rgba(56, 189, 248, 0.1); border-color: #38bdf8; }
        .back-btn svg { width: 20px; height: 20px; fill: #38bdf8; }

        /* Header */
        .header { text-align: center; margin-bottom: 25px; margin-top: 40px; }
        .header h2 { font-family: 'Orbitron', sans-serif; font-size: 1.5rem; letter-spacing: 2px; }
        .header h2 span { color: #38bdf8; }
        .header p { font-size: 0.85rem; opacity: 0.6; margin-top: 5px; }

        /* Form Layout: Two Columns for AI 1 and AI 2 */
        .ai-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Form Elements */
        .input-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
        .input-group label { font-size: 0.85rem; opacity: 0.8; font-weight: 300; }
        
        input, select {
            padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3); color: #fff; outline: none; font-size: 0.95rem;
            width: 100%; font-family: 'Poppins', sans-serif;
        }
        input:focus, select:focus { border-color: #38bdf8; }
        select option { background: #0b0f1a; color: #fff; }

        /* Full width for Topic */
        .full-width { grid-column: span 2; }

        /* Initiate Button */
        .btn {
            width: 100%; padding: 15px; border-radius: 12px; border: none;
            background: #38bdf8; color: #000; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: 0.3s; margin-top: 5px;
            font-family: 'Orbitron', sans-serif; letter-spacing: 1px;
        }
        .btn:hover { background: #7dd3fc; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(56, 189, 248, 0.3); }

        /* Responsive */
        @media (max-width: 450px) {
            .ai-grid { grid-template-columns: 1fr; gap: 0; }
            .full-width { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <a href="index.html" class="back-btn">
            <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/></svg>
        </a>

        <div class="header">
            <h2>BINARY <span>CLASH</span></h2>
            <p>Set up the AI Debate</p>
        </div>

        <div id="setup-screen">
            <div class="ai-grid">
                <div class="input-group">
                    <label>First AI Name</label>
                    <input type="text" id="ai1-name" placeholder="e.g. LogicBot">
                </div>
                <div class="input-group">
                    <label>First AI Model</label>
                    <select id="ai1-model">
                        <option value="gemini">Gemini 1.5 Flash</option>
                        <option value="chatgpt">ChatGPT 4.0</option>
                        <option value="groq">Groq (Ultra Fast)</option>
                        <option value="openrouter">OpenRouter (Free)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Second AI Name</label>
                    <input type="text" id="ai2-name" placeholder="e.g. CreativeBot">
                </div>
                <div class="input-group">
                    <label>Second AI Model</label>
                    <select id="ai2-model">
                        <option value="chatgpt">ChatGPT 4.0</option>
                        <option value="gemini">Gemini 1.5 Flash</option>
                        <option value="groq">Groq (Ultra Fast)</option>
                        <option value="openrouter">OpenRouter (Free)</option>
                    </select>
                </div>
            </div>

            <div class="input-group full-width">
                <label>Debate Topic</label>
                <input type="text" id="clash-topic" placeholder="e.g. Which is better: Android or iOS?">
            </div>

            <button class="btn" onclick="initiateClash()">START DEBATE</button>
        </div>
    </div>

    <script>
        function initiateClash() {
            const a1Name = document.getElementById('ai1-name').value.trim();
            const a1Model = document.getElementById('ai1-model').value;
            const a2Name = document.getElementById('ai2-name').value.trim();
            const a2Model = document.getElementById('ai2-model').value;
            const topic = document.getElementById('clash-topic').value.trim();

            if (!a1Name || !a2Name || !topic) {
                alert("Please fill in both AI names and the Debate Topic!");
                return;
            }

            // Save data to localStorage for chat2.html
            localStorage.setItem('trinova_m2_ai1_name', a1Name);
            localStorage.setItem('trinova_m2_ai1_model', a1Model);
            localStorage.setItem('trinova_m2_ai2_name', a2Name);
            localStorage.setItem('trinova_m2_ai2_model', a2Model);
            localStorage.setItem('trinova_m2_topic', topic);

            // Redirect to chat2.html
            window.location.href = 'chat2.html';
        }
    </script>
</body>
</html>
