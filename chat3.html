<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trinity Loop Chat | Trinova</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        /* Global Styles & Spack Editor Height Fixes */
        html, body { 
            margin: 0; padding: 0; 
            font-family: 'Poppins', sans-serif;
            background: #0b0f1a; color: #ffffff; 
            height: 100%; overflow: hidden; 
            display: flex; justify-content: center; align-items: center;
        }

        *, *::before, *::after { box-sizing: border-box; }

        .app-container {
            width: 100%; max-width: 600px; height: 100%;
            background: rgba(255, 255, 255, 0.02);
            display: flex; flex-direction: column; position: relative;
        }

        /* 📱 Header */
        .header {
            padding: 15px 20px;
            background: rgba(11, 15, 26, 0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; gap: 15px;
            z-index: 10; flex-shrink: 0;
        }
        
        .back-btn {
            width: 35px; height: 35px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.05); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .back-btn svg { width: 18px; height: 18px; fill: #38bdf8; }
        
        .header-info { display: flex; flex-direction: column; overflow: hidden; }
        .header-info h2 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; margin: 0; color: #38bdf8; white-space: nowrap; }
        .header-info p { font-size: 0.75rem; opacity: 0.6; margin: 0; }

        /* 💬 Chat Area */
        .chat-box {
            flex-grow: 1; overflow-y: auto;
            padding: 20px; display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }
        
        .chat-box::-webkit-scrollbar { width: 5px; }
        .chat-box::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 10px; }

        /* Message Bubbles */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 85%; }
        .msg-sender { font-size: 0.7rem; opacity: 0.8; margin-bottom: 4px; padding: 0 10px; font-weight: bold; }
        .msg { padding: 12px 16px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; position: relative; }

        /* User Message (Right Side) */
        .user-wrapper { align-self: flex-end; align-items: flex-end; }
        .user-wrapper .msg {
            background: #38bdf8; color: #000;
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        /* AI 1 Message (Left Side - Purple Accent) */
        .ai1-wrapper { align-self: flex-start; align-items: flex-start; }
        .ai1-wrapper .msg {
            background: rgba(255, 255, 255, 0.05); color: #fff;
            border-left: 3px solid #a78bfa; /* Purple border */
            border-radius: 4px 18px 18px 18px;
        }
        .ai1-wrapper .msg-sender { color: #a78bfa; }

        /* AI 2 Message (Left Side - Green Accent) */
        .ai2-wrapper { align-self: flex-start; align-items: flex-start; }
        .ai2-wrapper .msg {
            background: rgba(255, 255, 255, 0.05); color: #fff;
            border-left: 3px solid #10b981; /* Emerald Green border */
            border-radius: 4px 18px 18px 18px;
        }
        .ai2-wrapper .msg-sender { color: #10b981; }

        /* Typing Indicator */
        .typing-indicator {
            font-size: 0.8rem; opacity: 0.6; padding: 5px 20px;
            font-style: italic; display: none; color: #38bdf8; flex-shrink: 0;
        }

        /* ⌨️ Input Area */
        .input-area {
            padding: 15px 20px; background: rgba(11, 15, 26, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; gap: 10px; align-items: center;
            flex-shrink: 0; padding-bottom: 25px;
        }
        
        .input-area input {
            flex-grow: 1; padding: 14px 20px; border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.5); color: #fff; outline: none;
            font-family: 'Poppins', sans-serif; font-size: 0.95rem; min-width: 0;
        }
        .input-area input:focus { border-color: #38bdf8; }
        
        .send-btn {
            width: 45px; height: 45px; border-radius: 50%; border: none;
            background: #38bdf8; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: 0.3s; flex-shrink: 0;
        }
        .send-btn:hover { background: #7dd3fc; transform: scale(1.05); }
        .send-btn svg { width: 20px; height: 20px; fill: #000; margin-left: 3px; }
        .send-btn:disabled { background: #334155; cursor: not-allowed; transform: none; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <a href="option3.html" class="back-btn">
                <svg viewBox="0 0 24 24"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/></svg>
            </a>
            <div class="header-info">
                <h2>TRINITY LOOP</h2>
                <p id="group-members">Members: Loading...</p>
            </div>
        </div>

        <div class="chat-box" id="chat-box"></div>
        
        <div class="typing-indicator" id="typing-indicator">Someone is typing...</div>

        <div class="input-area">
            <input type="text" id="chat-input" placeholder="Message the group..." onkeypress="handleEnter(event)">
            <button class="send-btn" id="send-btn" onclick="sendGroupMessage()">
                <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // LocalStorage se details uthana
        const uName = localStorage.getItem('trinova_m3_user');
        const ai1Name = localStorage.getItem('trinova_m3_ai1_name');
        const ai1Model = localStorage.getItem('trinova_m3_ai1_model');
        const ai2Name = localStorage.getItem('trinova_m3_ai2_name');
        const ai2Model = localStorage.getItem('trinova_m3_ai2_model');

        // Check Setup
        if (!uName || !ai1Name || !ai2Name) {
            window.location.href = 'option3.html';
        }

        // Page load hone par
        window.onload = () => {
            document.getElementById('group-members').innerText = `You, ${ai1Name}, ${ai2Name}`;
            
            setTimeout(() => {
                appendMessage('SYSTEM', `Group created. ${ai1Name} and ${ai2Name} have joined. Say hi!`, 'system');
            }, 500);
        };

        // Asli Trinity Logic - Sequential API Calls
        async function sendGroupMessage() {
            const inputField = document.getElementById('chat-input');
            const userText = inputField.value.trim();
            const sendBtn = document.getElementById('send-btn');
            const typingIndicator = document.getElementById('typing-indicator');

            if (!userText) return;

            // 1. User Message Dikhao
            appendMessage(uName, userText, 'user');
            inputField.value = '';
            sendBtn.disabled = true; // Button lock taaki spam na ho

            try {
                // ==========================
                // 🚀 CALL 1: AI 1 ki baari
                // ==========================
                typingIndicator.innerText = `${ai1Name} is typing...`;
                typingIndicator.style.display = 'block';
                scrollToBottom();

                // Context for AI 1
                let promptForAI1 = `Group Chat Context: ${uName} just said: "${userText}". How do you reply?`;

                const res1 = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'option3', model: ai1Model, ai_name: ai1Name, message: promptForAI1 })
                });
                
                const data1 = await res1.json();
                let ai1ReplyText = data1.reply || "Error fetching reply.";
                
                // Show AI 1 Message
                typingIndicator.style.display = 'none';
                appendMessage(ai1Name, ai1ReplyText, 'ai1');

                // Thoda delay taaki real feel aaye
                await new Promise(r => setTimeout(r, 1000));

                // ==========================
                // 🚀 CALL 2: AI 2 ki baari
                // ==========================
                typingIndicator.innerText = `${ai2Name} is typing...`;
                typingIndicator.style.display = 'block';
                scrollToBottom();

                // Context for AI 2 (Isme User aur AI 1 dono ki baat jayegi)
                let promptForAI2 = `Group Chat Context: ${uName} said: "${userText}". Then ${ai1Name} replied: "${ai1ReplyText}". Add your own thoughts or react to them!`;

                const res2 = await fetch('api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'option3', model: ai2Model, ai_name: ai2Name, message: promptForAI2 })
                });
                
                const data2 = await res2.json();
                let ai2ReplyText = data2.reply || "Error fetching reply.";

                // Show AI 2 Message
                typingIndicator.style.display = 'none';
                appendMessage(ai2Name, ai2ReplyText, 'ai2');

            } catch (error) {
                typingIndicator.style.display = 'none';
                appendMessage('SYSTEM', 'Network Error: Check api.php connection.', 'system');
            }

            // Sab hone ke baad button unlock karo
            sendBtn.disabled = false;
        }

        // Message Append Logic
        function appendMessage(senderName, text, type) {
            const chatBox = document.getElementById('chat-box');
            
            const wrapperDiv = document.createElement('div');
            wrapperDiv.className = `msg-wrapper ${type}-wrapper`; 
            
            // System message ki alag styling
            if (type === 'system') {
                wrapperDiv.style.alignSelf = 'center';
                wrapperDiv.innerHTML = `<div class="msg" style="background: rgba(255,255,255,0.05); color: #a1a1aa; font-size: 0.8rem; border-radius: 10px;">${text}</div>`;
            } else {
                const senderSpan = document.createElement('span');
                senderSpan.className = 'msg-sender';
                senderSpan.innerText = senderName;
                wrapperDiv.appendChild(senderSpan);
                
                const msgDiv = document.createElement('div');
                msgDiv.className = 'msg';
                msgDiv.innerText = text;
                wrapperDiv.appendChild(msgDiv);
            }
            
            chatBox.appendChild(wrapperDiv);
            scrollToBottom();
        }

        function scrollToBottom() {
            const chatBox = document.getElementById('chat-box');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendGroupMessage();
            }
        }
    </script>
</body>
</html>
